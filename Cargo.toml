[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
drivers = { path = "crates/drivers" }
engine = { path = "crates/engine" }
ui = { path = "crates/ui" }

# GPUI comes in through gpui-kit (gpui-component + gpui-base + assets), pinned to
# one git revision. gpui-kit in turn pins an exact `gpui-pre` snapshot; see the
# decision log in docs/ARCHITECTURE.md.
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "3a39e9dfc97d8b12cf3c116708ada36bee02220b" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "net"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Release-speed code without the long single-threaded LTO link, for local
# perf runs: `cargo build --profile fast -p sorrel --features bench`.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

# GPUI is unusably slow unoptimized; keep our own crates fast to rebuild.
[profile.dev.package."*"]
opt-level = 2
